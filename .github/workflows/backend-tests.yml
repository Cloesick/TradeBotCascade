name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements.txt"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "requirements.txt"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic, non-production config for the test run.
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (excluding optional torch for speed)
        run: |
          python -m pip install --upgrade pip
          # torch is optional (deep-learning features degrade gracefully); skip
          # it in CI to keep installs fast. Everything else is required to import
          # the app and run the suite.
          grep -v -E '^torch' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: pytest -ra

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
